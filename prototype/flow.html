<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · 比稿作战室 — 流程原型</title>
<style>
  :root{
    --paper:#f7f5f1;
    --card:#ffffff;
    --ink:#191816;
    --ink-2:#4a4742;
    --ink-3:#8b857c;
    --line:#e6e1d8;
    --line-2:#f0ece4;
    --accent:#c04a2f;
    --accent-soft:#fdf0ec;
    --ok:#2f6b4f;
    --ok-soft:#eaf4ee;
    --warn:#a7712a;
    --warn-soft:#fbf2e2;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font:14px/1.65 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer}
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:16px;
    padding:12px 22px;
    background:rgba(247,245,241,.9);
    backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
  .brand b{font-size:15px;letter-spacing:.02em}
  .brand span{font-size:11px;color:var(--ink-3);letter-spacing:.14em}
  .proj{display:flex;align-items:center;gap:10px;min-width:0}
  .proj .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 9px;border-radius:999px;
    font-size:11.5px;white-space:nowrap;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
  }
  .pill i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
  .metrics{margin-left:auto;display:flex;gap:18px;align-items:center}
  .metric{text-align:right;line-height:1.25}
  .metric b{display:block;font:600 13px/1.2 var(--mono)}
  .metric span{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;white-space:nowrap}
  .ghost{
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:6px 11px;border-radius:9px;font-size:12px;white-space:nowrap;
  }
  .ghost:hover{border-color:#cfc8bb;color:var(--ink)}

  .shell{
    display:grid;
    grid-template-columns:236px minmax(0,1fr) 310px;
    gap:0;
    max-width:1480px;margin:0 auto;
    align-items:start;
  }
  /* ---------- left rail ---------- */
  .rail{
    position:sticky;top:57px;
    padding:22px 12px 40px 20px;
    border-right:1px solid var(--line);
    max-height:calc(100vh - 57px);overflow:auto;
  }
  .rail h4{
    margin:0 0 12px;font-size:10.5px;letter-spacing:.16em;
    color:var(--ink-3);font-weight:600;
  }
  .step{
    position:relative;display:flex;gap:10px;
    padding:8px 8px 8px 0;border-radius:9px;
    cursor:pointer;border:0;background:none;width:100%;text-align:left;
    color:var(--ink-3);
  }
  .step:hover{background:#fff}
  .step .dot{
    position:relative;z-index:1;flex:0 0 auto;
    width:19px;height:19px;border-radius:50%;
    border:1px solid var(--line);background:#fff;
    font:600 9.5px/17px var(--mono);text-align:center;color:var(--ink-3);
  }
  .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.current .dot{background:var(--ink);border-color:var(--ink);color:#fff}
  .step .lab{font-size:12.5px;line-height:1.35;padding-top:1px}
  .step .gate{
    display:inline-block;margin-top:3px;
    font:600 9.5px/1 var(--mono);letter-spacing:.05em;
    color:var(--accent);background:var(--accent-soft);
    border-radius:4px;padding:3px 5px;
  }
  .step.done .lab{color:var(--ink-2)}
  .step.current .lab{color:var(--ink);font-weight:600}
  .step::after{
    content:"";position:absolute;left:9px;top:27px;bottom:-8px;width:1px;background:var(--line);
  }
  .step:last-child::after{display:none}

  /* ---------- stage ---------- */
  .stage{padding:26px 30px 90px;min-width:0}
  .eyebrow{
    display:flex;align-items:center;gap:9px;
    font:600 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--ink-3);
    margin-bottom:9px;text-transform:uppercase;
  }
  .eyebrow .gate-tag{color:var(--accent);background:var(--accent-soft);padding:4px 6px;border-radius:4px;letter-spacing:.08em}
  h1{font-size:23px;line-height:1.35;margin:0 0 6px;letter-spacing:-.01em}
  .why{color:var(--ink-3);font-size:12.5px;margin:0 0 20px;max-width:62ch}
  .why b{color:var(--ink-2);font-weight:600}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:14px;
  }
  .card h3{
    margin:0 0 12px;font-size:11px;letter-spacing:.14em;color:var(--ink-3);
    font-weight:600;text-transform:uppercase;
  }
  .card p{margin:0 0 10px;color:var(--ink-2)}
  .card p:last-child{margin-bottom:0}
  .lead{font-size:16.5px;line-height:1.5;color:var(--ink);font-weight:500}
  .quote{
    border-left:2px solid var(--line);padding:2px 0 2px 14px;
    color:var(--ink-2);font-size:13px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:13px}
  .kv dt{color:var(--ink-3);font-size:12px}
  .kv dd{margin:0;color:var(--ink)}
  .tag{
    display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;
    background:#f3f0ea;color:var(--ink-2);margin:0 5px 5px 0;
  }
  .tag.on{background:var(--ok-soft);color:var(--ok);border:1px solid #cfe2d6}
  .tag.off{background:#f5f3ef;color:#a9a49b;text-decoration:line-through}
  .tag.maybe{background:var(--warn-soft);color:var(--warn);border:1px solid #eeddba}
  .tag.v{background:#eef1f7;color:#3d5378;border:1px solid #d5deed}
  .mono{font-family:var(--mono);font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2)}
  th{color:var(--ink-3);font-weight:600;font-size:10.5px;letter-spacing:.08em}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  tr:last-child td{border-bottom:0}

  .q-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .q-item:last-child{border-bottom:0}
  .q-badge{
    flex:0 0 auto;width:20px;height:20px;border-radius:5px;
    font:700 10.5px/20px var(--mono);text-align:center;color:#fff;background:var(--accent);
  }
  .q-badge.b{background:#8a8478}
  .q-badge.c{background:#b9b3a8}
  .q-body{min-width:0}
  .q-body b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
  .q-body span{font-size:11.5px;color:var(--ink-3)}
  .choice{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .choice button{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:6px 11px;font-size:12px;color:var(--ink-2);
  }
  .choice button:hover{border-color:#cfc8bb}
  .choice button.sel{background:var(--ink);border-color:var(--ink);color:#fff}

  .evidence{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .ev{
    border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:#fff;
  }
  .ev p{margin:0 0 8px;font-size:13px;line-height:1.55;color:var(--ink)}
  .ev footer{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--ink-3)}
  .ev footer .src{color:var(--ink-2);text-decoration:none;border-bottom:1px dotted #cfc8bb}

  .strat{cursor:pointer;transition:.16s;position:relative}
  .strat:hover{border-color:#cfc8bb;transform:translateY(-1px)}
  .strat.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
  .strat .pick{
    position:absolute;top:12px;right:12px;font-size:10px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:#fff;
  }
  .strat.sel .pick{background:var(--ink);color:#fff;border-color:var(--ink)}
  .strat h4{margin:0 0 5px;font-size:14.5px}
  .strat .one{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
  .strat dl{margin:0;font-size:11.5px;display:grid;grid-template-columns:52px 1fr;gap:4px 8px}
  .strat dt{color:var(--ink-3)}
  .strat dd{margin:0;color:var(--ink-2)}

  .gatecard{
    border:1px solid #e8c7bd;background:linear-gradient(180deg,#fffdfc,#fdf4f0);
    border-radius:14px;padding:16px 18px;margin-top:20px;
  }
  .gatecard h3{
    margin:0 0 4px;font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700;
  }
  .gatecard .ask{font-size:14px;margin:0 0 12px;color:var(--ink)}
  .actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .btn{
    border:0;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;
    background:var(--ink);color:#fff;
  }
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.32;cursor:not-allowed}
  .btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.alt:hover{border-color:#cfc8bb}
  .btn.danger{background:#fff;color:var(--accent);border:1px solid #e8c7bd}
  .hint{font-size:11.5px;color:var(--ink-3)}

  .check{list-style:none;margin:0;padding:0}
  .check li{
    display:flex;gap:9px;padding:7px 0;font-size:12.5px;color:var(--ink-2);
    border-bottom:1px solid var(--line-2);
  }
  .check li:last-child{border-bottom:0}
  .tick{flex:0 0 auto;width:15px;height:15px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:9px;line-height:15px;text-align:center;font-weight:700}
  .tick.no{background:var(--accent-soft);color:var(--accent)}
  .tick.wait{background:#f1eee8;color:#a9a49b}

  /* stage QA strip */
  .qa{
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    margin-top:16px;background:#fcfbf8;
  }
  .qa.pass{background:#f8fbf9;border-color:#dce9e1}
  .qa.fix{background:#fdf7f4;border-color:#ecd3c9}
  .qa-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qa-role{
    font:700 9.5px/1 var(--mono);letter-spacing:.08em;color:#fff;
    background:var(--ink);padding:4px 6px;border-radius:4px;
  }
  .qa-head b{font-size:12.5px}
  .qa-status{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap}
  .qa.pass .qa-status{color:var(--ok);font-weight:600}
  .qa.fix .qa-status{color:var(--accent);font-weight:600}
  .qa ul{list-style:none;margin:0;padding:0}
  .qa li{display:flex;gap:8px;font-size:12px;color:var(--ink-2);padding:4px 0;line-height:1.5}
  .qa .hint{margin-top:8px}

  /* quote form */
  .qrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .qrow label{font-size:12px;color:var(--ink-3)}
  .qrow input{
    width:120px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    font:600 13px/1.2 var(--mono);background:#fff;color:var(--ink);
  }
  .qrow input:focus{outline:2px solid #ead6cf;border-color:#d9b3a7}

  /* production loop */
  .asset{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .asset:last-child{margin-bottom:0}
  .asset .head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .asset .head b{font-size:13px}
  .asset p{margin:0;font-size:12.5px;color:var(--ink-2)}
  .asset.rev{border-color:#d9c9a8;background:#fffdf7}
  .fb{
    width:100%;min-height:78px;resize:vertical;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;background:#fff;
    font:13px/1.6 inherit;color:var(--ink);
  }
  .fb:focus{outline:2px solid #ead6cf;border-color:#d9b3a7}

  /* ---------- right rail ---------- */
  /* ---------- right rail (chat) ---------- */
  .side{padding:18px 18px 24px 0}
  .chat{position:sticky;top:57px;height:calc(100vh - 76px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .chat-top{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .chat-top b{font-size:12.5px}
  .chat-top .code{font:600 9.5px/1 var(--mono);color:var(--accent);background:var(--accent-soft);padding:4px 6px;border-radius:4px;letter-spacing:.06em}
  .chat-top .meta{margin-left:auto;font:11px var(--mono);color:var(--ink-3);text-align:right;line-height:1.3}
  .msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px 13px}
  .msg{max-width:94%;font-size:12.5px;line-height:1.62;padding:9px 11px;border-radius:11px;background:#fbfaf7;border:1px solid var(--line-2)}
  .msg .who{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:3px}
  .msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}
  .msg.me .who{color:#bdb6aa}
  .msg.sys{align-self:center;background:none;border:0;color:var(--ink-3);font-size:10.5px;padding:1px;text-align:center}
  .msg.agent .who{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 13px 8px}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;color:var(--ink-2)}
  .chips button:hover{border-color:#cfc8bb;color:var(--ink)}
  .chat-in{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
  .chat-in textarea{flex:1;min-height:38px;max-height:96px;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:12.5px/1.5 inherit;background:#fff;color:var(--ink)}
  .chat-in textarea:focus{outline:2px solid #ead6cf;border-color:#d9b3a7}
  .chat-in button{border:0;border-radius:9px;background:var(--ink);color:#fff;padding:10px 13px;font-size:12.5px;font-weight:600}

  /* ---------- terminal ---------- */
  .term{margin-bottom:18px;border-radius:13px;overflow:hidden;border:1px solid #262420;background:#161512;color:#d9d3c7;font-family:var(--mono);box-shadow:0 12px 30px -22px rgba(0,0,0,.5)}
  .term-head{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#1d1b17;border-bottom:1px solid #2a2721;font-size:10.5px;color:#8d8579;letter-spacing:.03em}
  .lights{display:flex;gap:4px}
  .lights i{width:8px;height:8px;border-radius:50%;background:#3a352c}
  .lights i:nth-child(1){background:#b8533b}
  .lights i:nth-child(2){background:#b08a3a}
  .lights i:nth-child(3){background:#4c7a4f}
  .term-live{margin-left:auto;color:#8fbf93;white-space:nowrap}
  .skip{border:0;background:#2a2721;color:#a8a091;border-radius:5px;padding:3px 7px;font:10px var(--mono);cursor:pointer}
  .skip:hover{background:#332f28;color:#d9d3c7}
  .term-body{height:200px;overflow:auto;padding:10px 12px;font-size:11.5px;line-height:1.95}
  .ln{display:flex;gap:9px;animation:lnin .16s ease}
  @keyframes lnin{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
  .ln .t{color:#6b655a;flex:0 0 auto}
  .ln .a{color:#dfb385;flex:0 0 66px}
  .ln .m{color:#cbc4b6;min-width:0}
  .ln.ok .m{color:#9cc8a6}
  .ln.warn .m{color:#dfb385}
  .ln.bad .m{color:#de8a72}
  .product{transition:opacity .3s}
  .product.dim{opacity:.3}

  .panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:12px}
  .panel h4{margin:0 0 10px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:600}
  .mini{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px}
  .mini dt{color:var(--ink-3)}
  .mini dd{margin:0;text-align:right;font-family:var(--mono);font-size:11.5px}
  .counter{display:flex;gap:6px}
  .counter div{flex:1;text-align:center;border:1px solid var(--line);border-radius:9px;padding:7px 4px}
  .counter b{display:block;font:600 16px/1.1 var(--mono)}
  .counter span{font-size:10px;color:var(--ink-3)}
  .counter .a b{color:var(--accent)}
  .logline{font-size:11.5px;color:var(--ink-2);padding:7px 0;border-bottom:1px dashed var(--line)}
  .logline:last-child{border-bottom:0}
  .logline b{font-family:var(--mono);font-size:10px;color:var(--accent);margin-right:5px}
  .empty{font-size:11.5px;color:var(--ink-3);margin:0}

  .banner{
    display:flex;gap:12px;align-items:flex-start;
    background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:13px 15px;margin-bottom:18px;font-size:12.5px;color:var(--ink-2);
  }
  .banner b{color:var(--ink)}
  .banner .x{margin-left:auto;border:0;background:none;color:var(--ink-3);font-size:15px;line-height:1}

  .done-hero{
    background:linear-gradient(180deg,#f3f8f4,#eef5f0);
    border:1px solid #d8e6dc;border-radius:14px;padding:22px;margin-bottom:14px;
  }
  .done-hero h2{margin:0 0 6px;font-size:18px}
  .done-hero p{margin:0;font-size:13px;color:var(--ink-2)}

  @media (max-width:1000px){
    .topbar{gap:10px;padding:11px 14px}
    .brand span{display:none}
    .proj .name{max-width:150px;font-size:13px}
    .metrics{gap:12px}
    .metric b{font-size:12px}
    .metric span{font-size:9.5px;letter-spacing:0}
  }
  @media (max-width:1180px){
    .shell{grid-template-columns:200px minmax(0,1fr) 300px}
    .stage{padding:24px 20px 80px}
    .term-body{height:176px}
    .ln .a{flex:0 0 58px;font-size:10.5px}
  }
  @media (max-width:980px){
    .shell{grid-template-columns:minmax(0,1fr) 292px}
    .rail{display:none}
    .stage{padding:20px 16px 70px}
    .grid3{grid-template-columns:1fr 1fr}
  }
  @media (max-width:700px){
    .shell{grid-template-columns:1fr}
    .stage{padding:16px 14px 30px}
    .grid2,.grid3,.evidence{grid-template-columns:1fr}
    .metrics{display:none}
    .side{padding:0 14px 24px}
    .chat{position:static;height:auto;max-height:60vh}
    .msgs{max-height:32vh}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><b>C · 比稿作战室</b><span>PROTOTYPE v0.3</span></div>
  <div class="proj">
    <span class="name">MORII 女装 · 2027 春夏上新比稿</span>
    <span class="pill" id="statePill"><i></i>接单 · 判断</span>
  </div>
  <div class="metrics">
    <div class="metric"><b id="mCost">¥0</b><span>项目成本</span></div>
    <div class="metric"><b id="mHours">0.0h</b><span>人时</span></div>
    <div class="metric"><b>24h</b><span>交付窗口</span></div>
  </div>
  <button class="ghost" id="reset">重置演示</button>
</header>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="stage">
    <div id="termHost"></div>
    <div id="product"></div>
  </main>
  <aside class="side" id="side"></aside>
</div>

<script>
/* ------------------------------------------------------------------ *
 * 数据：一个真实感的服装比稿样例
 * ------------------------------------------------------------------ */
const BRIEF_RAW = `【微信语音转写 · 08:47】
「这季我们想做轻通勤，别太职业，要能穿去上班也能约会。人群 25 到 32，一二线。
小红书和抖音为主，预算 120 万，不要投硬广，我们想看内容怎么做。
提报下周一，三家比稿，老板会来。」

【PDF · Brief 摘要】

/* ------------------------------------------------------------------ *

function stepS3(){
  return `

function qaStrip(stage, items, fixLabel, fixHandler, note){
  const fixes = items.filter(i=>i.ok==='fix').length;
  const warns = items.filter(i=>i.ok==='warn').length;
  const cls = fixes ? 'fix' : (warns ? '' : 'pass');
  const status = fixes
    ? `${fixes} 项未通过`
    : (warns ? `${warns} 项提醒` : `${items.length}/${items.length} 通过`);
  const icon = ok => ok==='fix' ? '<span class="tick no">!</span>'
    : ok==='warn' ? '<span class="tick wait">○</span>'
    : '<span class="tick">✓</span>';
  return `
  <div class="qa ${cls}">
    <div class="qa-head">
      <span class="qa-role">验收官</span>
      <b>${stage} · 阶段验收</b>
      <span class="qa-status">${status}</span>
    </div>
    <ul>${items.map(i=>`<li>${icon(i.ok)}<span>${i.t}</span></li>`).join('')}</ul>
    ${fixes && fixLabel ? `<div class="actions" style="margin-top:10px"><button class="btn" onclick="${fixHandler}()">${fixLabel}</button></div>` : ''}
    ${note?`<p class="hint">${note}</p>`:''}
  </div>`;
}

let termTimer = null;
let termKey = null;

function lineHTML(l){
  return `<div class="ln${l.k?' '+l.k:''}"><span class="t">${l.t}</span><span class="a">${l.a}</span><span class="m">${l.m}</span></div>`;

function setTermLive(txt, done, bad){
  const n = el('termLive'), b = el('skipBtn');
  if(n){ n.textContent = txt; n.style.color = bad ? '#de8a72' : (done ? '#7f8a80' : '#8fbf93'); }
  if(b) b.style.display = done ? 'none' : '';
}
function finishTerm(lines){
  if(termTimer){ clearInterval(termTimer); termTimer = null; }
  const p = el('product'); if(p) p.classList.remove('dim');
  if(lines.some(l=>l.k==='bad')) setTermLive('● 有阻断项', true, true);
  else if(lines.length && lines[lines.length-1].k==='warn'){ setTermLive('● 等你决定', true, false); const n=el('termLive'); if(n) n.style.color='#dfb385'; }
  else setTermLive('● 已完成', true, false);
}
function mountTerm(step){
  const host = el('termHost');
  if(!host) return;
  if(termTimer){ clearInterval(termTimer); termTimer = null; }
  const label = S.rejected ? 'S0 · 接单 · 判断' : `${STEPS[step].code} · ${STEPS[step].title}`;
  host.innerHTML = `
  <div class="term">
    <div class="term-head">
      <span class="lights"><i></i><i></i><i></i></span>
      <span>执行台 · ${label}</span>
      <span class="term-live" id="termLive">● 正在工作</span>
      <button class="skip" id="skipBtn" onclick="flushTerm()">跳过</button>
    </div>
    <div class="term-body" id="termBody"></div>
  </div>`;

  const lines = STEP_SCRIPT[step] || [];
  const body = el('termBody');
  if(S.termDone[step] || !lines.length){
    body.innerHTML = lines.map(lineHTML).join('');
    body.scrollTop = body.scrollHeight;
    finishTerm(lines);
    return;
  }
  body.innerHTML = '';
  let i = 0;
  const tick = () => {
    if(!document.getElementById('termBody')){ clearInterval(termTimer); termTimer = null; return; }
    if(i >= lines.length){
      clearInterval(termTimer); termTimer = null;
      S.termDone[step] = true;
      finishTerm(lines);
      return;
    }
    body.insertAdjacentHTML('beforeend', lineHTML(lines[i]));
    body.scrollTop = body.scrollHeight;
    i++;
  };
  tick();
  termTimer = setInterval(tick, 230);
}
function flushTerm(){
  if(termTimer){ clearInterval(termTimer); termTimer = null; }
  const body = el('termBody');
  if(!body) return;
  const step = S.rejected ? 0 : (S.archived ? 8 : S.step);
  const ls = STEP_SCRIPT[step] || [];
  body.innerHTML = ls.map(lineHTML).join('');
  body.scrollTop = body.scrollHeight;
  S.termDone[step] = true;
  finishTerm(ls);
}
function appendTerm(l){
  const body = el('termBody');
  if(!body) return;
  body.insertAdjacentHTML('beforeend', lineHTML(l));
  body.scrollTop = body.scrollHeight;
  setTermLive('● 已完成', true);
}

function sendChat(preset){
  const ta = el('chatInput');
  const v = preset !== undefined ? preset : ((ta && ta.value) || '').trim();
  if(!v) return;
  if(preset === undefined && ta) ta.value = '';
  pushChat('me', v);
  const reply = routeChat(v);
  if(reply) pushChat('agent', reply);
  render();
}

/* ------------------------------------------------------------------ */
function renderRail(){
  const done = S.archived ? STEPS.length : S.step;
  el('rail').innerHTML = `<h4>项目状态</h4>` + STEPS.map((s,i)=>{
    const cls = i===S.step && !S.archived ? 'current' : (i<done ? 'done' : '');
    const gateState = s.gate && S.gates[s.gate]==='pass' ? ' ✓' : '';
    return `<button class="step ${cls}" onclick="goStep(${i})">
      <span class="dot">${i<done?'✓':(i+1)}</span>
      <span class="lab">${s.title}${s.gate?`<span class="gate">${s.gate}${gateState}</span>`:''}</span>
    </button>`;
  }).join('');
}

function renderChat(){
  const key = S.archived ? 8 : S.step;
  const chips = (!S.archived && !S.rejected) ? (CHIPS[key] || []) : [];
  const code = S.archived || S.rejected ? '已归档' : STEPS[S.step].code;
  el('side').innerHTML = `
  <div class="chat">
    <div class="chat-top">
      <span class="code">${code}</span>
      <b>指挥台</b>
      <span class="meta">${fmtMoney(S.quote)}<br>¥${S.cost.toFixed(1)} · ${S.hours.toFixed(1)}h</span>
    </div>
    <div class="msgs" id="msgs">
      ${S.chat.map(m=>m.who==='sys'
        ? `<div class="msg sys">${m.text}</div>`
        : `<div class="msg ${m.who}"><span class="who">${m.who==='me'?'你':'执行台'}</span>${m.text}</div>`).join('')}
    </div>
    ${chips.length ? `<div class="chips">${chips.map(c=>`<button onclick="sendChat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>` : ''}
    <div class="chat-in">
      <textarea id="chatInput" rows="1" placeholder="说一句，或点上面的建议…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
      <button onclick="sendChat()">发送</button>
    </div>
  </div>`;
  scrollChat();
}

function render(){
  const banner = S.banner && S.step===0 && !S.rejected && !S.archived ? `
    <div class="banner">
      <span>👉</span>
      <div><b>这是可点的流程原型。</b> 上面是执行台（它正在做什么），下面是产物，右边是指挥台。<br>
      试试直接在右边说「报价 8800」或「主推单品：西装外套」——每句话都会落到某个状态上。</div>
      <button class="x" onclick="this.closest('.banner').remove()">×</button>
    </div>` : '';

  let body;
  if(S.rejected) body = stepRejected();
  else if(S.archived) body = stepDone();
  else body = [stepS0,stepS1,stepS2,stepS3,stepS4,stepS5,stepS6,stepS7,stepS8][S.step]();

  const key = S.rejected ? 'rej' : (S.archived ? 'done' : S.step);
  if(termKey !== key){
    termKey = key;
    mountTerm(S.rejected ? 0 : (S.archived ? 8 : S.step));
    const opener = S.rejected
      ? '归档了。理由我先按「赢面与投入不匹配」记着，可以改。'
      : S.archived
        ? '档案写完了。这一单的经验，下一单会先翻出来。'
        : CHAT_OPENERS[S.step];
    if(opener) pushChat('agent', opener);
  }

  el('product').innerHTML = banner + body;
  const curStep = S.rejected ? 0 : (S.archived ? 8 : S.step);
  el('product').classList.toggle('dim', !S.termDone[curStep]);

  const names = ['接单 · 判断','启动','调研','策略','生产','合稿','终验','交付','复盘'];
  el('statePill').innerHTML = `<i></i>${S.archived||S.rejected?'已归档':names[S.step]}`;
  el('mCost').textContent = '¥' + S.cost.toFixed(1);
  el('mHours').textContent = S.hours.toFixed(1) + 'h';

  renderRail(); renderChat();
}

render();
</script>
</body>
</html>
